name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to notice link rot in the projects this site points at.
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: "Lint, type check, test and build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  links:
    name: "Every rendered link resolves"
    # External links include free-tier services that sleep; run on a schedule or by hand rather
    # than on every push, so a slow wake-up never blocks a change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Serve the build and check links
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 > /dev/null && break; sleep 1; done
          npm run check:links -- http://localhost:3000
